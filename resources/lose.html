<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku / Try again</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .result { min-height: 80vh; display: grid; place-items: center; text-align: center; }
    .result h1 { font-size: clamp(4rem, 12vw, 10rem); line-height: .8; letter-spacing: -.08em; margin: 20px 0; }
    .result p { color: var(--muted); font-size: 1.1rem; margin-bottom: 30px; }
    .result.shake { animation: shake .55s ease-out; }
    .lose-flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(circle at center, rgba(176, 58, 46, .28), rgba(23, 35, 31, .35));
      opacity: 0; animation: flash 1.1s ease-out forwards;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-12px); }
      30% { transform: translateX(10px); }
      45% { transform: translateX(-8px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
    }
    @keyframes flash {
      0% { opacity: .9; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="lose-flash" aria-hidden="true"></div>
  <main class="shell result shake">
    <section>
      <p class="eyebrow">This one got away</p>
      <h1>Try<br>again.</h1>
      <p>The board is still here. Your next pattern may be the one.</p>
      <a class="btn" href="level.html">Choose another</a>
    </section>
  </main>
</body>
</html>
