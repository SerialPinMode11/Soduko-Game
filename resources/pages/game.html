<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sudoku / Board</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/game.css"></head>
<body><main class="shell"><header class="game-top"><div class="game-title"><a class="brand" href="level.html"><span class="brand-mark"><i></i><i></i><i></i><i></i></span> SUDOKU / 01</a><h1 id="level-title">Medium</h1></div><div class="stats"><span>TIME<strong id="timer">00:00</strong></span><span>MISTAKES<strong id="mistakes">0 / 3</strong></span><span>HINTS<strong id="hints">3</strong></span><button class="settings-button" id="settings-button" type="button" aria-haspopup="dialog">Settings</button></div></header><div class="game-layout"><section><div id="board" class="board" role="grid" aria-label="Sudoku board"></div><aside id="bot-panel" class="bot-panel" aria-live="polite"><div class="bot-avatar" aria-hidden="true">S</div><div class="bot-bubble"><p id="bot-message">Ready when you are.</p></div></aside></section><aside class="side-panel"><h2>Make a move</h2><p>Select a square, then use a number key or the buttons below. Notes mode keeps small candidate marks in a cell.</p><div class="tool-row"><button class="btn secondary" id="undo" type="button">Undo</button><button class="btn secondary" id="hint" type="button">Hint</button><button class="btn secondary" id="check" type="button">Check</button><button class="btn secondary" id="new-game" type="button">New board</button></div><label class="mode"><span>Notes mode</span><input id="notes-mode" type="checkbox"></label><div class="toolbar" id="number-pad" aria-label="Number pad"></div></aside></div></main><div class="settings-modal" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><div class="settings-card"><div class="settings-heading"><div><p class="eyebrow">Game controls</p><h2 id="settings-title">Settings</h2></div><button class="close-button" id="settings-close" type="button" aria-label="Close settings">Close</button></div><label class="setting-row"><span><strong>Background music</strong><small>Play the looping game theme.</small></span><input id="music-enabled" type="checkbox"></label><label class="setting-row"><span><strong>Button sounds</strong><small>Play a soft sound on every click.</small></span><input id="sound-enabled" type="checkbox"></label><label class="setting-row volume-row"><span><strong>Music volume</strong><small>Adjust the theme level.</small></span><input id="music-volume" type="range" min="0" max="100" step="1"></label></div></div><script type="module" src="../js/game.js"></script></body></html>
